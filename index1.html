    <meta property="og:title" content="MUSLIM SHOP — Исламский магазин г. Атырау" />
    <meta property="og:description" content="ТД «Дина Байзар», бутик №24. WhatsApp: +7 778 175 42 41, Instagram: @MUSLIIM_SHOP06. Заказ в 1 клик, время намаза в Атырау." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
      // Automatically handle GitHub Pages subpath trailing slashes for clean relative asset loading
      (function() {
        var p = window.location.pathname;
        if (!p.endsWith('/') && !p.split('/').pop().includes('.')) {
          window.location.replace(window.location.protocol + '//' + window.location.host + p + '/' + window.location.search + window.location.hash);
        }
      })();
    </script>
  </head>
  <body style="margin: 0; padding: 0; background-color: #0f1115; color: #f3f4f6; font-family: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;" class="bg-[#0f1115] text-[#f3f4f6] antialiased selection:bg-[#d97706]/30 selection:text-[#fbbf24]">
    <div id="root">
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background-color: #0f1115; color: #f3f4f6; text-align: center; padding: 24px; box-sizing: border-box;">
        <div style="width: 56px; height: 56px; border-radius: 16px; background: linear-gradient(135deg, #d97706, #059669); display: flex; align-items: center; justify-content: center; font-size: 28px; margin-bottom: 16px; box-shadow: 0 10px 25px rgba(217, 119, 6, 0.3);">
          🌙
        </div>
        <h1 style="font-family: 'Cinzel', serif; font-size: 22px; font-weight: bold; letter-spacing: 2px; margin: 0 0 8px 0; color: #fbbf24;">
          MUSLIM SHOP
        </h1>
        <p id="app-loader-text" style="font-size: 14px; color: #9ca3af; margin: 0 0 20px 0;">
          Загрузка магазина...
        </p>
        <div id="app-loader-spinner" style="width: 28px; height: 28px; border: 3px solid rgba(251, 191, 36, 0.2); border-top-color: #fbbf24; border-radius: 50%; animation: spin 1s linear infinite;"></div>
        <style>
          @keyframes spin { to { transform: rotate(360deg); } }
        </style>
      </div>
    </div>
    <script>
      window.addEventListener('error', function(e) {
        var loader = document.getElementById('app-loader-text');
        var spinner = document.getElementById('app-loader-spinner');
        if (loader && !window.__APP_MOUNTED__) {
          if (spinner) spinner.style.display = 'none';
          loader.innerHTML = '<div style="background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 12px; padding: 14px; max-width: 320px; margin: 0 auto;">' +
            '<div style="color: #f87171; font-weight: bold; margin-bottom: 6px;">Ошибка загрузки</div>' +
            '<div style="font-size: 12px; color: #d1d5db; margin-bottom: 12px;">' + (e.message || 'Ошибка запуска скрипта') + '</div>' +
            '<button onclick="localStorage.clear(); sessionStorage.clear(); location.reload();" style="padding: 8px 16px; background: #d97706; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Очистить кэш и перезапустить</button>' +
          '</div>';
        }
      });
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
